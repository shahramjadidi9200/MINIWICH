<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>مینی ویچ | Mini Vich Fast Food</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0c0c0c;--card:#171717;--card2:#202020;--gold:#f5b51b;--gold2:#ffcf43;--text:#fff;--muted:#bdbdbd;--line:#303030;}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#0a0a0a,#151515);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
a{color:inherit;text-decoration:none} button{font:inherit}
.container{width:min(760px,100%);margin:auto;padding:0 14px 120px}
.hero{margin:10px 0 14px;border:1px solid #333;border-radius:24px;overflow:hidden;background:#111;box-shadow:0 14px 40px #0008}
.hero img{width:100%;height:245px;object-fit:cover;object-position:center 22%;display:block;filter:brightness(.72)}
.heroText{padding:18px 18px 20px;margin-top:-58px;position:relative;background:linear-gradient(transparent,#111 34%)}
.brand{font-size:30px;font-weight:900;color:var(--gold)} .en{font-size:15px;color:#eee;letter-spacing:2px}
.slogan{margin-top:8px;font-size:15px;color:#ddd}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}
.action{background:#171717;border:1px solid #343434;border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;transition:.2s}
.action:hover{border-color:var(--gold)} .icon{font-size:21px;display:block;margin-bottom:4px}
.search{position:sticky;top:0;z-index:10;background:#0c0c0ced;backdrop-filter:blur(12px);padding:10px 0}
.search input{width:100%;background:#1b1b1b;border:1px solid #363636;color:#fff;border-radius:16px;padding:14px 16px;outline:none}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid #383838;background:#191919;color:#ddd;border-radius:999px;padding:9px 14px;cursor:pointer}
.cat.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}
.section{margin-top:10px} .sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sectionTitle h2{font-size:21px;margin:0} .sectionTitle span{color:var(--gold);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;min-width:0}
.card h3{margin:0 0 7px;font-size:15px} .price{color:var(--gold2);font-weight:900;font-size:18px}
.pizzaSizes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}
.size{border:1px solid #3b3b3b;background:#222;color:#ccc;border-radius:9px;padding:7px 3px;font-size:10px;cursor:pointer}
.size.selected{border-color:var(--gold);background:#4a3710;color:#fff}
.size b{display:block;color:var(--gold2);font-size:12px;margin-top:2px}
.add{width:100%;margin-top:7px;border:0;background:var(--gold);color:#111;border-radius:11px;padding:9px;font-weight:900;cursor:pointer}
.simple{display:flex;align-items:center;justify-content:space-between;gap:8px}
.simple .add{width:auto;min-width:78px}
.contact{margin-top:28px;background:#121212;border:1px solid #333;border-radius:20px;padding:16px}
.contact h3{margin:0 0 10px;color:var(--gold)} .contact p{margin:7px 0;color:#ddd;font-size:13px}
.cart{position:fixed;right:50%;transform:translateX(50%);bottom:14px;width:min(720px,calc(100% - 28px));z-index:30;background:#171717ee;border:1px solid #444;backdrop-filter:blur(15px);border-radius:18px;padding:10px;box-shadow:0 12px 35px #000b}
.cartline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cartCount{background:var(--gold);color:#111;border-radius:999px;padding:3px 9px;font-weight:900}
.cartBtn{border:0;background:var(--gold);color:#111;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.empty{color:#aaa;font-size:12px}
.toast{position:fixed;top:18px;right:50%;transform:translateX(50%);background:#f5b51b;color:#111;padding:10px 16px;border-radius:12px;font-weight:800;display:none;z-index:50}
@media(max-width:520px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:repeat(4,1fr)}.hero img{height:215px}}
</style>
</head>

    <div><span class="cartCount" id="count">0</span> قلم در سبد <span id="total" style="color:#f5b51b;font-weight:900"></span></div>
    <button class="cartBtn" onclick="checkout()">ثبت سفارش</button>

<div class="toast" id="toast">به سبد اضافه شد</div>

<script>
const DATA = {"پیتزا": [["پیتزا مخصوص", {"یکنفره": 540, "دونفره": 740, "خانواده": 1030}], ["پیتزا قارچ و گوشت", {"یکنفره": 570, "دونفره": 780, "خانواده": 1100}], ["پیتزا قارچ و مرغ", {"یکنفره": 600, "دونفره": 780, "خانواده": 920}], ["پیتزا پپرونی", {"یکنفره": 600, "دونفره": 780, "خانواده": 1000}], ["پیتزا مرغ و گوشت", {"یکنفره": 530, "دونفره": 800, "خانواده": 1100}], ["پیتزا سبزیجات", {"یکنفره": 500, "دونفره": 600, "خانواده": 800}]], "ساندویچ‌ها": [["کوکتل", 240], ["بندری ساده", 320], ["بندری ویژه", 500], ["ژامبون گوشت", 400], ["مخصوص مینی ویچ", 500], ["ژامبون مرغ", 400]], "پیش‌غذاها": [["سیب‌زمینی ویژه", 350], ["سیب‌زمینی ساده", 300], ["سیب‌زمینی ژامبون", 400], ["نان سیر", 300]], "برگرها": [["برگر پنیری", 450], ["برگر ساده", 400], ["برگر ویژه", 495]], "نوشیدنی‌ها": [["خانواده کوکا", 140], ["خانواده اسپریت", 140], ["خانواده دلستر", 140], ["خانواده لیموناد", 140]]};
const cats = Object.keys(DATA);
let active = "همه";
let cart = [];

function fmt(n) { return new Intl.NumberFormat('fa-IR').format(n); }
function esc(s) { return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderCats() {
  document.getElementById('cats').innerHTML =
    ['همه',...cats].map(c => `<button class="cat ${active===c?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('');
}

function add(name, price, size='') {
  cart.push({name,price,size});
  document.getElementById('toast').style.display='block';
  setTimeout(()=>document.getElementById('toast').style.display='none',800);
  updateCart();
}

function render() {
  renderCats();
  const q = document.getElementById('search').value.trim().toLowerCase();
  let html='';
  for (const [cat, items] of Object.entries(DATA)) {
    if (active !== 'همه' && active !== cat) continue;
    const filtered = items.filter(x => x[0].toLowerCase().includes(q));
    if (!filtered.length) continue;
    html += `<section class="section"><div class="sectionTitle"><h2>${cat}</h2><span>${filtered.length} مورد</span></div><div class="grid">`;
    filtered.forEach(item => {
      const name=item[0], val=item[1];
      if (typeof val === 'object') {
        const sizes=Object.entries(val);
        const id='s_'+name.replace(/\s/g,'_');
        html += `<article class="card"><h3>${esc(name)}</h3><div class="pizzaSizes" id="${id}">
          ${sizes.map(([s,p],i)=>`<button class="size ${i===0?'selected':''}" onclick="selectSize(this,'${id}')">${s}<b>${fmt(p)}</b></button>`).join('')}
        </div><button class="add" onclick="addPizza('${name}','${id}')">افزودن به سبد</button></article>`;
      } else {
        html += `<article class="card simple"><div><h3>${esc(name)}</h3><div class="price">${fmt(val)} تومان</div></div><button class="add" onclick="add('${name}',${val})">+</button></article>`;
      }
    });
    html += '</div></section>';
  }
  document.getElementById('menu').innerHTML=html || '<p class="empty">موردی پیدا نشد.</p>';
  updateCart();
}

function selectSize(btn,id) {
  document.querySelectorAll('#'+CSS.escape(id)+' .size').forEach(x=>x.classList.remove('selected'));
  btn.classList.add('selected');
}
function addPizza(name,id) {
  const btn=document.querySelector('#'+CSS.escape(id)+' .size.selected');
  const text=btn.innerText.trim().split('\n');
  const size=text[0], price=parseInt(text[1].replace(/[^0-9]/g,''));
  add(name,price,size);
}
function updateCart() {
  document.getElementById('count').textContent=fmt(cart.length);
  const total=cart.reduce((a,x)=>a+x.price,0);
  document.getElementById('total').textContent=total ? '— '+fmt(total)+' تومان' : '';
  document.getElementById('cartItems').innerHTML=cart.length
    ? cart.slice(-3).map(x=>`${esc(x.name)}${x.size?' ('+esc(x.size)+')':''}`).join('، ')+(cart.length>3?' ...':'')
    : 'سبد خرید خالی است';
}
function checkout() {
  if (!cart.length) { alert('سبد خرید خالی است.'); return; }
  const lines=cart.map((x,i)=>`${i+1}. ${x.name}${x.size?' - '+x.size:''} — ${fmt(x.price)} تومان`).join('\n');
  const total=cart.reduce((a,x)=>a+x.price,0);
  const msg=`سلام مینی ویچ، سفارش من:\n${lines}\nمبلغ تقریبی: ${fmt(total)} تومان`;
  navigator.clipboard?.writeText(msg);
  alert('متن سفارش آماده شد و (در صورت پشتیبانی مرورگر) کپی شد. برای ثبت نهایی با مینی ویچ تماس بگیرید: 09900539200');
}
render();
</script>
